<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registraion Form</title>
</head>
<body>
    <h1 align="center">Student Registraion Form</h1>
    <form>
<label>Full Name:</label>
<input type="text" placeholder="Enter your name" required><br>
<br>
<label>Email:</label>
<input type="email" placeholder="Enter email" required><br>
<br>
<label>Password:</label>
<input type="tel" placeholder="Enter Password" required><br>
<br>
<label>Gender:</label>
<input type="radio" placeholder="male" required>male
<input type="radio" placeholder="female" required>female
<input type="radio" placeholder="other" required>other <br>
<br>
<label>Course:</label>
<select> 
    <option>Select Course</option>
    <option>B.Tech</option>
    <option>M.Tech</option>
    <option>MCA</option>
    <option>BCA</option>
</select><br>
<br>
<label>Contact No:</label>
<input type="number" placeholder="Enter Phone number" required><br>
<br>
<label>Address:</label><br>
<textarea rows="5" ></textarea><br>
<br>
<button>Register</button>
<button>Clear</button>
<hr>
&copy; Student Registration Portal
    </form>
</body>
</html>
